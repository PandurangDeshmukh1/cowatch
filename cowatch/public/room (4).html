<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineSync — Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #05050d; --bg2: #0b0b18; --bg3: #12121f;
      --glass: rgba(255,255,255,0.03); --gb: rgba(255,255,255,0.07); --gbh: rgba(255,255,255,0.13);
      --text: #eeeef5; --text2: #8888a8; --text3: #3d3d58;
      --red: #e8503a; --red2: #ff7d68; --gold: #f0b429;
      --green: #2dd4a0; --blue: #5db8ff; --purple: #a78bfa;
      --r: 14px; --rs: 10px;
    }
    html,body { height:100%; overflow:hidden; }
    body { background:var(--bg); color:var(--text); font-family:'Plus Jakarta Sans',sans-serif; font-size:14px; }

    .bg { position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden; }
    .orb { position:absolute;border-radius:50%;filter:blur(120px);opacity:0.15; }
    .o1 { width:600px;height:600px;background:radial-gradient(circle,#e8503a,transparent 65%);top:-200px;left:-100px; }
    .o2 { width:400px;height:400px;background:radial-gradient(circle,#5db8ff,transparent 65%);bottom:-100px;right:-80px; }

    /* LAYOUT */
    .room { display:grid;grid-template-columns:1fr 300px;grid-template-rows:56px 1fr;height:100vh;position:relative;z-index:1; }

    /* HEADER */
    .hdr {
      grid-column:1/-1;
      display:flex;align-items:center;justify-content:space-between;
      padding:0 20px;
      background:rgba(5,5,13,0.9);
      backdrop-filter:blur(20px);
      border-bottom:1px solid var(--gb);
      gap:12px;
    }
    .hdr-logo { display:flex;align-items:center;gap:8px;text-decoration:none; }
    .lmark { width:28px;height:28px;background:linear-gradient(135deg,#e8503a,#b03020);border-radius:8px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(232,80,58,0.4);flex-shrink:0; }
    .lname { font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;color:var(--text); }

    .room-badge {
      padding:4px 12px;
      background:var(--glass);border:1px solid var(--gb);border-radius:100px;
      font-size:11px;color:var(--text2);cursor:pointer;
      transition:all 0.2s;letter-spacing:0.04em;
    }
    .room-badge:hover { background:var(--red);color:white;border-color:var(--red); }

    .now-watching {
      flex:1;text-align:center;font-size:12px;color:var(--text3);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      font-style:italic;
    }
    .now-watching span { color:var(--text2); }

    .hdr-right { display:flex;align-items:center;gap:8px; }

    .uc { display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2); }
    .udot { width:6px;height:6px;border-radius:50%;background:var(--green); }

    .icon-btn {
      width:32px;height:32px;border-radius:50%;
      background:var(--glass);border:1px solid var(--gb);
      color:var(--text);cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:all 0.15s;flex-shrink:0;
    }
    .icon-btn:hover { background:var(--red);border-color:var(--red); }
    .icon-btn.active { background:#e74c3c;border-color:#e74c3c; }
    .icon-btn.active-blue { background:var(--blue);border-color:var(--blue); }

    /* VIDEO AREA */
    .video-area { background:#000;display:flex;flex-direction:column;overflow:hidden; }

    .video-wrap { flex:1;position:relative;background:#03030a;display:flex;align-items:center;justify-content:center;overflow:hidden; }
    .video-wrap video { width:100%;height:100%;object-fit:contain; }
    #ytFrame { width:100%;height:100%;border:none;display:none; }

    .placeholder {
      display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--text3);
    }
    .placeholder svg { opacity:0.25; }
    .placeholder p { font-size:13px;font-weight:300; }

    /* SYNC BADGE */
    .sync-badge {
      position:absolute;top:12px;right:12px;
      padding:4px 10px;border-radius:100px;font-size:11px;font-weight:500;
      background:rgba(45,212,160,0.15);border:1px solid rgba(45,212,160,0.3);
      color:var(--green);display:none;
    }
    .sync-badge.show { display:block; }
    .sync-badge.out { background:rgba(240,180,41,0.15);border-color:rgba(240,180,41,0.3);color:var(--gold); }

    /* EMOJI REACTIONS */
    .reactions-bar {
      display:flex;align-items:center;gap:6px;
      padding:6px 14px;
      border-top:1px solid var(--gb);
      background:rgba(5,5,13,0.7);
    }
    .reactions-bar span { font-size:11px;color:var(--text3);margin-right:4px; }
    .react-btn {
      width:32px;height:32px;border-radius:50%;
      background:var(--glass);border:1px solid var(--gb);
      font-size:16px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:transform 0.15s,background 0.15s;
    }
    .react-btn:hover { transform:scale(1.25);background:var(--gbh); }

    /* FLOATING EMOJIS */
    .emoji-float {
      position:absolute;font-size:28px;
      animation:floatUp 2.5s ease-out forwards;
      pointer-events:none;z-index:50;
    }
    @keyframes floatUp {
      0% { opacity:1;transform:translateY(0) scale(1); }
      100% { opacity:0;transform:translateY(-160px) scale(1.4); }
    }

    /* URL BAR */
    .url-bar {
      display:flex;gap:6px;padding:8px 14px;
      border-top:1px solid var(--gb);background:var(--bg2);
    }
    .url-bar input {
      flex:1;background:rgba(255,255,255,0.04);border:1px solid var(--gb);
      border-radius:var(--rs);color:var(--text);
      font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;padding:8px 12px;outline:none;
      transition:border-color 0.2s;
    }
    .url-bar input:focus { border-color:rgba(232,80,58,0.45); }
    .url-bar input::placeholder { color:var(--text3); }

    .btn-load {
      padding:8px 14px;
      background:linear-gradient(135deg,#ff6b4a,#c0392b);
      color:white;border:none;border-radius:var(--rs);
      font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:600;
      cursor:pointer;white-space:nowrap;
      box-shadow:0 2px 12px rgba(232,80,58,0.3);
      transition:opacity 0.2s,transform 0.15s;
    }
    .btn-load:hover { opacity:0.85;transform:translateY(-1px); }

    .btn-file {
      padding:8px 12px;
      background:rgba(240,180,41,0.12);
      color:var(--gold);border:1px solid rgba(240,180,41,0.25);
      border-radius:var(--rs);font-family:'Plus Jakarta Sans',sans-serif;
      font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;
      transition:background 0.2s;
    }
    .btn-file:hover { background:rgba(240,180,41,0.22); }

    .btn-yt {
      padding:8px 12px;
      background:rgba(255,50,50,0.12);
      color:#ff6666;border:1px solid rgba(255,50,50,0.25);
      border-radius:var(--rs);font-family:'Plus Jakarta Sans',sans-serif;
      font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;
      transition:background 0.2s;
    }
    .btn-yt:hover { background:rgba(255,50,50,0.22); }

    .local-note {
      display:none;padding:5px 14px;
      background:rgba(240,180,41,0.07);
      border-top:1px solid rgba(240,180,41,0.12);
      font-size:11px;color:var(--gold);
    }

    /* CONTROLS */
    .controls {
      display:flex;align-items:center;gap:10px;
      padding:10px 14px;border-top:1px solid var(--gb);background:var(--bg2);
    }
    .prog-wrap { flex:1;display:flex;flex-direction:column;gap:3px; }
    .prog-bar {
      height:4px;background:var(--gbh);border-radius:2px;
      cursor:pointer;overflow:hidden;
    }
    .prog-fill {
      height:100%;width:0%;
      background:linear-gradient(90deg,var(--red),var(--red2));
      border-radius:2px;transition:width 0.1s linear;pointer-events:none;
    }
    .time { font-size:10px;color:var(--text3);font-variant-numeric:tabular-nums; }

    .btn-sync {
      padding:0 12px;height:32px;border-radius:var(--rs);
      background:rgba(93,184,255,0.1);border:1px solid rgba(93,184,255,0.2);
      color:var(--blue);font-family:'Plus Jakarta Sans',sans-serif;
      font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;
      transition:background 0.2s;
    }
    .btn-sync:hover { background:rgba(93,184,255,0.2); }

    /* SIDEBAR */
    .sidebar { border-left:1px solid var(--gb);background:var(--bg2);display:flex;flex-direction:column;overflow:hidden; }

    /* CAMERAS */
    .cams { display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px;border-bottom:1px solid var(--gb); }
    .cam-box {
      position:relative;background:var(--bg3);border-radius:var(--rs);
      aspect-ratio:4/3;overflow:hidden;
      display:flex;align-items:center;justify-content:center;
      border:1px solid var(--gb);
    }
    .cam-box video { width:100%;height:100%;object-fit:cover; }
    .cam-lbl {
      position:absolute;bottom:5px;left:5px;
      font-size:9px;background:rgba(0,0,0,0.7);color:white;
      padding:2px 6px;border-radius:5px;font-weight:500;
    }
    .cam-off { color:var(--text3);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px; }

    /* USER LIST */
    .user-list {
      padding:8px 12px;border-bottom:1px solid var(--gb);
      display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    }
    .user-chip {
      display:flex;align-items:center;gap:5px;
      padding:3px 8px;background:var(--glass);border:1px solid var(--gb);
      border-radius:100px;font-size:11px;color:var(--text2);
    }
    .user-avatar {
      width:16px;height:16px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:8px;font-weight:700;color:white;flex-shrink:0;
    }

    /* CHAT */
    .chat-sec { flex:1;display:flex;flex-direction:column;min-height:0; }
    .chat-hdr {
      padding:8px 14px;font-size:10px;color:var(--text3);
      text-transform:uppercase;letter-spacing:0.08em;
      border-bottom:1px solid var(--gb);font-weight:600;
    }
    .chat-msgs {
      flex:1;overflow-y:auto;padding:10px 12px;
      display:flex;flex-direction:column;gap:10px;
      scrollbar-width:thin;scrollbar-color:var(--bg3) transparent;
    }
    .msg { display:flex;flex-direction:column;gap:2px; }
    .msg-hdr { display:flex;align-items:baseline;gap:6px; }
    .msg-name { font-size:11px;font-weight:600;color:var(--blue); }
    .msg-name.me { color:var(--red2); }
    .msg-time { font-size:10px;color:var(--text3); }
    .msg-text { font-size:12px;color:var(--text2);line-height:1.5;font-weight:300; }
    .sys-msg { font-size:10px;color:var(--text3);text-align:center;font-style:italic;padding:2px 0; }

    .chat-in {
      padding:8px 10px;border-top:1px solid var(--gb);
      display:flex;gap:6px;
    }
    .chat-in input {
      flex:1;background:rgba(255,255,255,0.04);border:1px solid var(--gb);
      border-radius:var(--rs);color:var(--text);
      font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;padding:7px 10px;outline:none;
    }
    .chat-in input:focus { border-color:rgba(232,80,58,0.4); }
    .chat-in input::placeholder { color:var(--text3); }
    .btn-send {
      padding:7px 12px;
      background:linear-gradient(135deg,#ff6b4a,#c0392b);
      color:white;border:none;border-radius:var(--rs);
      font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;
      transition:opacity 0.2s;
    }
    .btn-send:hover { opacity:0.85; }

    /* JOIN NOTIFICATION */
    .join-notif {
      position:fixed;top:70px;right:20px;z-index:200;
      background:var(--bg3);border:1px solid var(--gbh);
      border-radius:var(--r);padding:12px 16px;
      display:flex;align-items:center;gap:10px;
      font-size:13px;color:var(--text);
      box-shadow:0 8px 32px rgba(0,0,0,0.4);
      transform:translateX(120%);transition:transform 0.4s cubic-bezier(0.16,1,0.3,1);
      max-width:240px;
    }
    .join-notif.show { transform:translateX(0); }
    .join-notif-icon { width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0; }

    /* TOAST */
    .toast {
      position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(16px);
      background:var(--bg3);border:1px solid var(--gbh);border-radius:100px;
      padding:8px 18px;font-size:12px;color:var(--text2);
      opacity:0;transition:opacity 0.3s,transform 0.3s;
      pointer-events:none;z-index:200;white-space:nowrap;
      backdrop-filter:blur(10px);
    }
    .toast.show { opacity:1;transform:translateX(-50%) translateY(0); }

    @media(max-width:680px) {
      .room { grid-template-columns:1fr;grid-template-rows:56px 1fr 38vh; }
      .sidebar { max-height:38vh; }
    }
  </style>
</head>
<body>

<div class="bg"><div class="orb o1"></div><div class="orb o2"></div></div>

<div class="room">

  <!-- HEADER -->
  <header class="hdr">
    <a href="/" class="hdr-logo">
      <div class="lmark">
        <svg width="13" height="13" viewBox="0 0 18 18" fill="none">
          <circle cx="9" cy="9" r="8" stroke="white" stroke-width="1.5"/>
          <path d="M7 6l5 3-5 3V6z" fill="white"/>
        </svg>
      </div>
      <span class="lname">CineSync</span>
    </a>

    <span class="room-badge" id="roomBadge" onclick="copyLink()">Room: ...</span>

    <div class="now-watching" id="nowWatching">No video loaded</div>

    <div class="hdr-right">
      <div class="uc"><div class="udot"></div><span id="userCountText">1 watching</span></div>
      <button class="icon-btn" id="camBtn" title="Camera" onclick="toggleCamera()">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M2 5h8a1 1 0 011 1v4a1 1 0 01-1 1H2a1 1 0 01-1-1V6a1 1 0 011-1z" stroke="currentColor" stroke-width="1.3"/><path d="M11 7l4-2v6l-4-2V7z" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
      <button class="icon-btn" id="micBtn" title="Mic" onclick="toggleMic()">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><rect x="5" y="2" width="6" height="8" rx="3" stroke="currentColor" stroke-width="1.3"/><path d="M3 8a5 5 0 0010 0" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M8 13v2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <!-- VIDEO AREA -->
  <div class="video-area">
    <div class="video-wrap" id="videoWrap">
      <div class="placeholder" id="placeholder">
        <svg width="56" height="56" viewBox="0 0 64 64" fill="none"><rect x="4" y="14" width="40" height="36" rx="6" stroke="white" stroke-width="2"/><path d="M44 26l16-8v28L44 38V26z" stroke="white" stroke-width="2"/></svg>
        <p>Load a URL, YouTube link, or pick a file from your PC</p>
      </div>
      <video id="mainVideo" style="display:none;"></video>
      <iframe id="ytFrame" allowfullscreen allow="autoplay; encrypted-media"></iframe>
      <div class="sync-badge" id="syncBadge">● In Sync</div>
    </div>

    <!-- EMOJI REACTIONS -->
    <div class="reactions-bar">
      <span>React:</span>
      <button class="react-btn" onclick="sendReaction('😂')">😂</button>
      <button class="react-btn" onclick="sendReaction('😮')">😮</button>
      <button class="react-btn" onclick="sendReaction('😍')">😍</button>
      <button class="react-btn" onclick="sendReaction('😱')">😱</button>
      <button class="react-btn" onclick="sendReaction('👏')">👏</button>
      <button class="react-btn" onclick="sendReaction('🔥')">🔥</button>
      <button class="react-btn" onclick="sendReaction('💀')">💀</button>
      <button class="react-btn" onclick="sendReaction('❤️')">❤️</button>
    </div>

    <!-- URL BAR -->
    <div class="url-bar">
      <input type="text" id="videoUrl" placeholder="Paste video URL or YouTube link..." />
      <button class="btn-yt" onclick="loadYouTube()">▶ YouTube</button>
      <button class="btn-load" onclick="loadVideo()">Load URL</button>
      <button class="btn-file" onclick="document.getElementById('fileInput').click()">📁 PC</button>
      <input type="file" id="fileInput" accept="video/*" style="display:none;" onchange="loadLocalFile(event)" />
    </div>
    <div class="local-note" id="localNote">⚠️ Playing from PC — your friend must load the same file too.</div>

    <!-- CONTROLS -->
    <div class="controls">
      <button class="icon-btn" id="playBtn" onclick="togglePlay()">
        <svg id="playIcon" width="12" height="12" viewBox="0 0 14 14" fill="currentColor"><path d="M3 2l9 5-9 5V2z"/></svg>
      </button>
      <div class="prog-wrap">
        <div class="prog-bar" id="progBar" onclick="seekVideo(event)">
          <div class="prog-fill" id="progFill"></div>
        </div>
        <div class="time" id="timeDisp">0:00 / 0:00</div>
      </div>
      <button class="btn-sync" onclick="forceSyncPartner()">⟳ Sync</button>
    </div>
  </div>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <!-- CAMERAS -->
    <div class="cams">
      <div class="cam-box">
        <video id="localVideo" autoplay muted playsinline style="display:none;"></video>
        <div class="cam-off" id="localCamOff">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          You
        </div>
        <div class="cam-lbl">You</div>
      </div>
      <div class="cam-box">
        <video id="remoteVideo" autoplay playsinline style="display:none;"></video>
        <div class="cam-off" id="remoteCamOff">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Friend
        </div>
        <div class="cam-lbl">Friend</div>
      </div>
    </div>

    <!-- USER LIST -->
    <div class="user-list" id="userList"></div>

    <!-- CHAT -->
    <div class="chat-sec">
      <div class="chat-hdr">Live Chat</div>
      <div class="chat-msgs" id="chatMsgs"></div>
      <div class="chat-in">
        <input type="text" id="chatInput" placeholder="Say something..." maxlength="200" onkeydown="if(event.key==='Enter')sendChat()" />
        <button class="btn-send" onclick="sendChat()">Send</button>
      </div>
    </div>
  </aside>
</div>

<!-- JOIN NOTIFICATION -->
<div class="join-notif" id="joinNotif">
  <div class="join-notif-icon" id="joinIcon">👤</div>
  <div>
    <div style="font-weight:600;font-size:13px;" id="joinName"></div>
    <div style="font-size:11px;color:var(--text3);">joined the room</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ── Setup ────────────────────────────────────────────────────────────────
const roomId = location.pathname.split('/room/')[1];
const params = new URLSearchParams(location.search);
const username = params.get('name') || 'Guest';
const COLORS = ['#e8503a','#5db8ff','#a78bfa','#2dd4a0','#f0b429','#ff7d68'];
const myColor = COLORS[Math.floor(Math.random()*COLORS.length)];

const socket = io();
let isSyncing = false, localStream = null, peerConnection = null, peerId = null;
let camEnabled = false, micEnabled = false, isYT = false;
const ICE = { iceServers:[{urls:'stun:stun.l.google.com:19302'}] };

// elements
const video     = document.getElementById('mainVideo');
const ytFrame   = document.getElementById('ytFrame');
const placeholder = document.getElementById('placeholder');
const progFill  = document.getElementById('progFill');
const timeDisp  = document.getElementById('timeDisp');
const toast     = document.getElementById('toast');
const chatMsgs  = document.getElementById('chatMsgs');
const localVideo= document.getElementById('localVideo');
const remoteVideo=document.getElementById('remoteVideo');
const roomBadge = document.getElementById('roomBadge');
const syncBadge = document.getElementById('syncBadge');
const userListEl= document.getElementById('userList');
const nowWatch  = document.getElementById('nowWatching');

// ── Socket ────────────────────────────────────────────────────────────────
roomBadge.textContent = `Room: ${roomId}`;
socket.emit('join-room', { roomId, username, color: myColor });

socket.on('room-state', ({time, playing, url}) => {
  if (url) { loadVideoUrl(url); setTimeout(()=>{ video.currentTime=time; if(playing) video.play(); },500); }
});

socket.on('room-users', (users) => {
  document.getElementById('userCountText').textContent = `${users.length} watching`;
  userListEl.innerHTML = users.map(u => `
    <div class="user-chip">
      <div class="user-avatar" style="background:${u.color||'#666'}">${(u.username||'?')[0].toUpperCase()}</div>
      ${esc(u.username)}
    </div>`).join('');
});

socket.on('user-joined', ({id, username:uname, color}) => {
  peerId = id;
  showJoinNotif(uname, color);
  addSys(`${uname} joined`);
  if (localStream) initiateCall();
});

socket.on('user-left', ({username:uname}) => {
  addSys(`${uname} left`);
  if (peerConnection) { peerConnection.close(); peerConnection = null; }
  remoteVideo.style.display='none'; document.getElementById('remoteCamOff').style.display='flex';
});

socket.on('video-url-set', ({url}) => loadVideoUrl(url));

socket.on('video-action', ({action, time}) => {
  if (!video.src && !isYT) return;
  isSyncing = true;
  if (!isYT) {
    if (Math.abs(video.currentTime - time) > 1) video.currentTime = time;
    if (action==='play') video.play().catch(()=>{});
    if (action==='pause') video.pause();
  }
  setTimeout(()=>isSyncing=false, 300);
  showToast(action==='play' ? '▶ Partner pressed play' : '⏸ Partner paused');
});

socket.on('chat-message', ({message, username:uname, time, color}) => {
  appendChat(uname, message, time, uname===username, color);
});

socket.on('reaction', ({emoji, username:uname}) => {
  spawnEmoji(emoji);
  addSys(`${uname} reacted ${emoji}`);
});

// ── Video ─────────────────────────────────────────────────────────────────
function loadVideo() {
  const url = document.getElementById('videoUrl').value.trim();
  if (!url) return;
  // Auto-detect YouTube
  if (url.includes('youtube.com') || url.includes('youtu.be')) { loadYouTube(); return; }
  socket.emit('set-video-url', {roomId, url});
  loadVideoUrl(url);
}

function loadYouTube() {
  const url = document.getElementById('videoUrl').value.trim();
  const id = extractYTId(url);
  if (!id) { showToast('⚠️ Invalid YouTube URL'); return; }
  isYT = true;
  video.style.display='none';
  ytFrame.style.display='block';
  placeholder.style.display='none';
  ytFrame.src = `https://www.youtube.com/embed/${id}?autoplay=1&enablejsapi=1`;
  nowWatch.innerHTML = `<span>Now watching:</span> YouTube video`;
  document.getElementById('localNote').style.display='none';
  showToast('🎬 YouTube loaded! Note: sync is manual for YouTube');
  addSys('YouTube video loaded — use ⟳ Sync button to stay in sync');
}

function extractYTId(url) {
  const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

function loadVideoUrl(url) {
  isYT = false;
  ytFrame.style.display='none';
  video.src = url; video.style.display='block'; placeholder.style.display='none';
  document.getElementById('videoUrl').value = url;
  document.getElementById('localNote').style.display='none';
  const name = url.split('/').pop().replace(/\.[^.]+$/,'') || 'Video';
  nowWatch.innerHTML = `<span>Now watching:</span> ${esc(name)}`;
  syncBadge.classList.add('show');
}

function loadLocalFile(e) {
  const file = e.target.files[0]; if (!file) return;
  isYT = false; ytFrame.style.display='none';
  video.src = URL.createObjectURL(file);
  video.style.display='block'; placeholder.style.display='none';
  document.getElementById('localNote').style.display='block';
  nowWatch.innerHTML = `<span>Now watching:</span> ${esc(file.name)}`;
  syncBadge.classList.add('show');
  showToast('📁 ' + file.name + ' loaded!');
  addSys(`Local file loaded: ${file.name} — ask your friend to load the same file!`);
}

function togglePlay() {
  if (isYT) { showToast('Use YouTube controls to play/pause'); return; }
  if (!video.src) return;
  if (video.paused) { video.play(); socket.emit('video-action',{roomId,action:'play',time:video.currentTime}); }
  else { video.pause(); socket.emit('video-action',{roomId,action:'pause',time:video.currentTime}); }
}

function seekVideo(e) {
  if (isYT || !video.src || !video.duration) return;
  const r = e.currentTarget.getBoundingClientRect();
  video.currentTime = ((e.clientX-r.left)/r.width)*video.duration;
  socket.emit('video-action',{roomId,action:video.paused?'pause':'play',time:video.currentTime});
}

function forceSyncPartner() {
  if (isYT) { showToast('⟳ Tell your friend to pause/play manually for YouTube'); return; }
  if (!video.src) return;
  socket.emit('video-action',{roomId,action:video.paused?'pause':'play',time:video.currentTime});
  showToast('⟳ Synced!');
}

video.addEventListener('timeupdate', ()=>{
  if (!video.duration) return;
  progFill.style.width = (video.currentTime/video.duration*100)+'%';
  timeDisp.textContent = `${fmt(video.currentTime)} / ${fmt(video.duration)}`;
  // sync check
  if (!isSyncing) {
    syncBadge.classList.remove('out');
    syncBadge.classList.add('show');
  }
});
video.addEventListener('play', ()=>setPlayIcon(true));
video.addEventListener('pause', ()=>setPlayIcon(false));
function setPlayIcon(p) {
  document.getElementById('playIcon').innerHTML = p
    ? '<rect x="3" y="2" width="3" height="10" rx="1"/><rect x="8" y="2" width="3" height="10" rx="1"/>'
    : '<path d="M3 2l9 5-9 5V2z"/>';
}
function fmt(s) { return `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`; }

// ── Emoji Reactions ───────────────────────────────────────────────────────
function sendReaction(emoji) {
  socket.emit('reaction', {roomId, emoji, username});
  spawnEmoji(emoji);
}

function spawnEmoji(emoji) {
  const wrap = document.getElementById('videoWrap');
  const el = document.createElement('div');
  el.className = 'emoji-float';
  el.textContent = emoji;
  el.style.left = (20 + Math.random()*60)+'%';
  el.style.bottom = '10%';
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}

// ── Chat ──────────────────────────────────────────────────────────────────
function sendChat() {
  const inp = document.getElementById('chatInput');
  const msg = inp.value.trim(); if (!msg) return;
  socket.emit('chat-message',{roomId,message:msg,username,color:myColor});
  inp.value='';
}

function appendChat(uname, message, time, isMe, color) {
  const d = document.createElement('div'); d.className='msg';
  d.innerHTML=`<div class="msg-hdr"><span class="msg-name${isMe?' me':''}" style="color:${color||''}">${esc(uname)}</span><span class="msg-time">${time||''}</span></div><div class="msg-text">${esc(message)}</div>`;
  chatMsgs.appendChild(d);
  chatMsgs.scrollTop=chatMsgs.scrollHeight;
}

function addSys(text) {
  const d=document.createElement('div'); d.className='sys-msg'; d.textContent=text;
  chatMsgs.appendChild(d); chatMsgs.scrollTop=chatMsgs.scrollHeight;
}

// ── Join notification ─────────────────────────────────────────────────────
function showJoinNotif(uname, color) {
  const n = document.getElementById('joinNotif');
  document.getElementById('joinName').textContent = uname;
  document.getElementById('joinIcon').style.background = color||'#555';
  document.getElementById('joinIcon').textContent = uname[0].toUpperCase();
  n.classList.add('show');
  setTimeout(()=>n.classList.remove('show'), 3500);
}

// ── Toast ─────────────────────────────────────────────────────────────────
let tt;
function showToast(msg) {
  toast.textContent=msg; toast.classList.add('show');
  clearTimeout(tt); tt=setTimeout(()=>toast.classList.remove('show'),2200);
}

// ── Copy link ─────────────────────────────────────────────────────────────
function copyLink() {
  navigator.clipboard.writeText(location.href).then(()=>{
    roomBadge.textContent='✓ Copied!';
    setTimeout(()=>roomBadge.textContent=`Room: ${roomId}`,2000);
  });
}

// ── WebRTC ────────────────────────────────────────────────────────────────
async function toggleCamera() {
  if (!localStream) {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({video:true,audio:true});
      localVideo.srcObject=localStream; localVideo.style.display='block';
      document.getElementById('localCamOff').style.display='none';
      camEnabled=true; micEnabled=true;
      document.getElementById('camBtn').classList.add('active-blue');
      if (peerId) initiateCall();
    } catch(e) { showToast('Camera access denied'); }
  } else {
    const vt=localStream.getVideoTracks()[0];
    if(vt){vt.enabled=!vt.enabled;camEnabled=vt.enabled;}
    document.getElementById('camBtn').classList.toggle('active-blue',camEnabled);
  }
}

function toggleMic() {
  if (!localStream) return;
  const at=localStream.getAudioTracks()[0];
  if(at){at.enabled=!at.enabled;micEnabled=at.enabled;}
  document.getElementById('micBtn').classList.toggle('active',!micEnabled);
}

async function initiateCall() {
  createPC();
  const offer=await peerConnection.createOffer();
  await peerConnection.setLocalDescription(offer);
  socket.emit('rtc-offer',{to:peerId,offer});
}

function createPC() {
  if(peerConnection) peerConnection.close();
  peerConnection=new RTCPeerConnection(ICE);
  if(localStream) localStream.getTracks().forEach(t=>peerConnection.addTrack(t,localStream));
  peerConnection.ontrack=e=>{
    remoteVideo.srcObject=e.streams[0]; remoteVideo.style.display='block';
    document.getElementById('remoteCamOff').style.display='none';
  };
  peerConnection.onicecandidate=e=>{ if(e.candidate&&peerId) socket.emit('rtc-ice',{to:peerId,candidate:e.candidate}); };
  peerConnection.onconnectionstatechange=()=>{ if(peerConnection.connectionState==='disconnected'){ remoteVideo.style.display='none'; document.getElementById('remoteCamOff').style.display='flex'; } };
}

socket.on('rtc-offer',async({from,offer})=>{ peerId=from; createPC(); await peerConnection.setRemoteDescription(offer); const ans=await peerConnection.createAnswer(); await peerConnection.setLocalDescription(ans); socket.emit('rtc-answer',{to:from,answer:ans}); });
socket.on('rtc-answer',async({answer})=>{ if(peerConnection) await peerConnection.setRemoteDescription(answer); });
socket.on('rtc-ice',async({candidate})=>{ if(peerConnection) try{await peerConnection.addIceCandidate(candidate);}catch(e){} });

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT') return; if(e.code==='Space'){e.preventDefault();togglePlay();} });
</script>
