<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineSync — Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>

<div class="bg-canvas">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="grain"></div>
</div>

<div class="room-layout">

  <header class="room-header">
    <a href="/" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
      <div class="logo-icon" style="width:30px;height:30px;border-radius:9px;">
        <svg width="15" height="15" viewBox="0 0 18 18" fill="none">
          <circle cx="9" cy="9" r="8" stroke="white" stroke-width="1.5"/>
          <path d="M7 6l5 3-5 3V6z" fill="white"/>
        </svg>
      </div>
      <span style="font-family:'Playfair Display',serif;font-size:16px;color:var(--text);">CineSync</span>
    </a>

    <span class="room-id-badge" id="roomBadge" title="Click to copy link" onclick="copyLink()">Room: ...</span>

    <div style="display:flex;align-items:center;gap:10px;">
      <div class="user-count"><div class="user-dot"></div><span id="userCountText">1 watching</span></div>
      <button class="ctrl-btn" id="camBtn" title="Toggle camera" onclick="toggleCamera()">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M2 5h8a1 1 0 011 1v4a1 1 0 01-1 1H2a1 1 0 01-1-1V6a1 1 0 011-1z" stroke="currentColor" stroke-width="1.3"/><path d="M11 7l4-2v6l-4-2V7z" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
      <button class="ctrl-btn" id="micBtn" title="Toggle mic" onclick="toggleMic()">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="5" y="2" width="6" height="8" rx="3" stroke="currentColor" stroke-width="1.3"/><path d="M3 8a5 5 0 0010 0" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M8 13v2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <div class="video-area">
    <div class="video-container" id="videoContainer">
      <div class="video-placeholder" id="placeholder">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none"><rect x="4" y="14" width="40" height="36" rx="6" stroke="white" stroke-width="2"/><path d="M44 26l16-8v28L44 38V26z" stroke="white" stroke-width="2"/></svg>
        <p>Load a video URL or select a file from your PC</p>
      </div>
      <video id="mainVideo" style="display:none;" controls></video>
    </div>

    <!-- URL + File loader bar -->
    <div class="url-bar">
      <input type="text" id="videoUrl" placeholder="Paste a direct video URL (.mp4, .webm)..." />
      <button onclick="loadVideo()" style="white-space:nowrap;">Load URL</button>
      <button onclick="document.getElementById('fileInput').click()" class="btn-file" style="white-space:nowrap;">
        📁 From PC
      </button>
      <input type="file" id="fileInput" accept="video/*" style="display:none;" onchange="loadLocalFile(event)" />
    </div>

    <!-- local file note -->
    <div id="localFileNote" style="display:none;padding:6px 16px;background:rgba(245,200,66,0.08);border-top:1px solid rgba(245,200,66,0.15);font-size:12px;color:#f5c842;">
      ⚠️ Playing from your PC — your friend needs to load the same file on their device too.
    </div>

    <div class="controls-bar">
      <button class="ctrl-btn" id="playBtn" onclick="togglePlay()" title="Play / Pause">
        <svg id="playIcon" width="13" height="13" viewBox="0 0 14 14" fill="currentColor"><path d="M3 2l9 5-9 5V2z"/></svg>
      </button>

      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar" onclick="seekVideo(event)">
          <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>
        <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
      </div>

      <button class="ctrl-btn" title="Sync with partner" onclick="forceSyncPartner()" style="font-size:11px;width:auto;padding:0 12px;border-radius:10px;font-family:'Outfit',sans-serif;">⟳ Sync</button>
    </div>
  </div>

  <aside class="sidebar">
    <div class="cameras">
      <div class="cam-box">
        <video id="localVideo" autoplay muted playsinline style="display:none;"></video>
        <div class="cam-off-icon" id="localCamOff">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          You
        </div>
        <div class="cam-label">You</div>
      </div>
      <div class="cam-box">
        <video id="remoteVideo" autoplay playsinline style="display:none;"></video>
        <div class="cam-off-icon" id="remoteCamOff">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Friend
        </div>
        <div class="cam-label">Friend</div>
      </div>
    </div>

    <div class="chat-section">
      <div class="chat-header">Live Chat</div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-wrap">
        <input type="text" id="chatInput" placeholder="Say something..." maxlength="200" onkeydown="chatKeydown(event)" />
        <button onclick="sendChat()">Send</button>
      </div>
    </div>
  </aside>

</div>

<div class="toast" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/room.js"></script>
</body>
</html>
